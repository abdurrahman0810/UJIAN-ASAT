<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>UJIAN ASAT</title>
  </head>
  <body>
    <div class="parent">
      <div class="child">
        <h1>Cek Nilai Siswa</h1>
        <input type="number" name="" id="box" placeholder="Masukkan nilai" />
        <button id="result">Cek Nilai</button>
        <div id="input"></div>
      </div>
    </div>

    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: inter;
        font-weight: 500;
      }
      body {
        background-color: #667eea;
      }
      #box {
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 2px;
        padding-right: 2px;
        border: 1px solid yellow;
        text-align: left;
        border-radius: 8px;
      }
      .parent {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .child {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: left;
        width: 24vw;
        height: 31vh;
        border-radius: 17px;
        background-color: white;
        gap: 20px;
      }
      #result {
        color: white;
        background-color: #5a67d8;
        width: 80px;
        height: 30px;
        text-align: center;
        border: none;
        border-radius: 6px;
      }
    </style>

    <script>
      function Fungsi(age) {
        let hasil = document.getElementById("input");
        hasil.innerHTML = age;
      }

      function cekAge(FungsiAge, HitungAge) {
        let result = "";

        if (FungsiAge >= 75) {
          result = "Selamat Anda Lulus 🎉";
        } else {
          result = "Maaf Anda Tidak Lulus 😢";
        }

        HitungAge(result);
      }

      let btn = document.getElementById("result");

      btn.addEventListener("click", () => {
        let box = document.getElementById("box").value;

        cekAge(box, Fungsi);
      });
    </script>
  </body>
</html>
